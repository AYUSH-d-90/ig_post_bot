name: Daily Tech Post
on:
  schedule:
    - cron: '0 12 * * *' # Runs daily
  workflow_dispatch: # Allows manual run
  push:
    branches: [ main ]
    paths-ignore:
      - 'latest_post.jpg'
      - 'caption.txt'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install google-generativeai Pillow requests

      - name: Generate Content and Image
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py

      - name: Commit and Push Image
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add latest_post.jpg caption.txt
          git commit -m "Update daily post image [skip ci]"
          git push
        
      - name: Post to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -c "import bot; f=open('caption.txt'); cap=f.read(); bot.post_to_instagram('latest_post.jpg', cap)"
