name: Daily Tech Post

on:
  schedule:
    - cron: '0 2 * * *' # Runs at 7:30 AM IST (2:00 AM UTC) daily
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai requests Pillow
          pip list  # This will print a list of everything installed so we can PROVE it's there

      - name: Run Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          python -u bot.py  # The -u flag forces Python to show all logs instantly

      - name: Save Image to GitHub Pages
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add post.jpg
          git commit -m "Update daily post image" || exit 0
          git push
